<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Komunitas Teknologi</title>
    <link rel="stylesheet" href="">
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Sign Up - Komunitas Teknologi</h1>
        <div id="auth">
            <a href=""><button>Kembali ke Beranda</button></a>
        </div>
    </header>

    <!-- Sign-Up Form -->
    <section id="signUpForm">
        <div class="form-container">
            <h2>Sign Up</h2>
            <form id="signUp">
                <label for="signUpName">Name:</label>
                <input type="text" id="signUpName" required><br>
                <label for="signUpEmail">Email:</label>
                <input type="email" id="signUpEmail" required><br>
                <label for="signUpPassword">Password:</label>
                <input type="password" id="signUpPassword" required><br>
                <button type="submit">Sign Up</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Komunitas Teknologi. </p>
    </footer>
</body>
</html>
